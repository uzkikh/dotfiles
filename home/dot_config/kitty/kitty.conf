include Catppuccin-Mocha.conf

font_family      Iosevka Term
bold_font        Iosevka Term Medium
italic_font      Iosevka Term Oblique
bold_italic_font Iosevka Term Medium Oblique
font_size 20.0

# Use FiraCode Nerd Font Mono for symbols (larger, more visible icons)
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 FiraCode Nerd Font Mono

hide_window_decorations titlebar-only
window_padding_width 8

copy_on_select yes
detect_urls yes

# macOS-style clipboard bindings with RU layout support
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
# Russian layout support: same physical keys as cmd+c / cmd+v above, so copy
# and paste keep working without switching the input source. The two lines
# below are bindings, not comments -- the Cyrillic in them is load-bearing.
map cmd+с copy_to_clipboard
map cmd+м paste_from_clipboard

# Reload config
map ctrl+shift+f5 load_config_file
